<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books API</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 560px;
            width: 100%;
            padding: 2rem;
        }
        h1 {
            font-size: 1.75rem;
            color: #58a6ff;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .links { display: flex; flex-direction: column; gap: 0.75rem; }
        .link-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            text-decoration: none;
            color: #c9d1d9;
            transition: border-color 0.2s, transform 0.15s;
        }
        .link-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .icon-blue   { background: #1c3a5f; }
        .icon-green  { background: #1a3326; }
        .icon-purple { background: #2d1b42; }
        .icon-orange { background: #3d2a10; }
        .link-text { display: flex; flex-direction: column; }
        .link-title { font-weight: 600; font-size: 1rem; }
        .link-url   { font-size: 0.8rem; color: #8b949e; margin-top: 2px; }
        .arrow {
            margin-left: auto;
            color: #484f58;
            transition: color 0.2s, transform 0.2s;
        }
        .link-card:hover .arrow { color: #58a6ff; transform: translateX(3px); }
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Books API</h1>
        <p class="subtitle">Django REST Framework · PostgreSQL</p>

        <div class="links">
            <a class="link-card" href="/api/books/">
                <div class="link-icon icon-blue">📖</div>
                <div class="link-text">
                    <span class="link-title">Список книг</span>
                    <span class="link-url">/api/books/</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a class="link-card" href="/api/books/1/">
                <div class="link-icon icon-green">🔍</div>
                <div class="link-text">
                    <span class="link-title">Книга (ID: 1)</span>
                    <span class="link-url">/api/books/{id}/</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a class="link-card" href="/api/">
                <div class="link-icon icon-purple">🧭</div>
                <div class="link-text">
                    <span class="link-title">API Router</span>
                    <span class="link-url">/api/</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a class="link-card" href="/admin/">
                <div class="link-icon icon-orange">⚙️</div>
                <div class="link-text">
                    <span class="link-title">Django Admin</span>
                    <span class="link-url">/admin/</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <p class="footer">Books-DRF · 4 книги в базе</p>
    </div>
</body>
</html>
